name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npm run check
      - run: npm run lint
      - run: npm run check:doc-budget

      # High/critical only (--audit-level=high) — low/moderate are reported by
      # `npm audit` but don't fail the build. One standing low-severity
      # exception today: elliptic (GHSA-848j-6mx2-7j84), pulled in transitively
      # via vite-plugin-node-polyfills' crypto-browserify chain (a Vite build
      # plugin, not app code). The only fix is `npm audit fix --force`, which
      # downgrades vite-plugin-node-polyfills 0.28.x -> 0.2.0 — a major,
      # breaking rollback of the active version for a low-severity advisory.
      # Revisit when a fixed vite-plugin-node-polyfills release exists.
      - run: npm run check:audit
      - run: npm run check:licenses
      - run: npm test
      - run: npm run test:scripts

      # No secrets configured here; the WebDAV adapter is always available.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # playwright.config.ts starts the preview and signaling servers itself.
      - run: npx playwright test
        env:
          CI: true

  # Structural guards on deploy/turn/, not a live relay test; deploy/turn/TESTING.md
  # covers the manual tiers that exercise NAT traversal and TLS on a real VPS.
  turn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file and image pin
        run: |
          rendered=$(docker compose -f deploy/turn/docker-compose.yml config)
          echo "$rendered" | grep -qE 'image: coturn/coturn:[0-9]' \
            || { echo "::error file=deploy/turn/docker-compose.yml::coturn image must be pinned to a version, not :latest"; exit 1; }

      # The live copy holds the shared secret and the public IP.
      - name: Assert turnserver.conf is git-ignored
        run: |
          cp deploy/turn/turnserver.conf.example deploy/turn/turnserver.conf
          git check-ignore -q deploy/turn/turnserver.conf \
            || { echo "::error file=deploy/turn/.gitignore::deploy/turn/turnserver.conf is not git-ignored — real secrets could be committed"; exit 1; }
          rm -f deploy/turn/turnserver.conf

      # Deleting one of these weakens the relay silently.
      - name: Assert hardening directives are present
        run: |
          conf=deploy/turn/turnserver.conf.example
          req=(
            'denied-peer-ip=127.0.0.0-127.255.255.255'
            'denied-peer-ip=169.254.0.0-169.254.255.255'
            'denied-peer-ip=100.64.0.0-100.127.255.255'
            'denied-peer-ip=::1'
            'total-quota='
            'max-bps='
            'min-port=49152'
            'max-port=65535'
            'fingerprint'
            'no-cli'
          )
          status=0
          for line in "${req[@]}"; do
            grep -qF "$line" "$conf" || { echo "::error file=$conf::missing hardening directive: $line"; status=1; }
          done
          exit $status

      # coturn exits early on a config it rejects, which the checks above cannot
      # see (a trailing inline comment parses as a directive's value). Detached
      # plus State.Running, not `timeout docker run`: a config it accepts
      # daemonizes and ignores the SIGTERM docker forwards, hanging the job.
      - name: Smoke-test that coturn accepts the config
        run: |
          sed -e 's/YOUR_PUBLIC_IP/127.0.0.1/' \
              -e 's/YOUR_DOMAIN/test.local/' \
              -e 's/CHANGE_ME_STRONG_SECRET/ci-test-secret/' \
              deploy/turn/turnserver.conf.example > /tmp/turnserver.conf
          set +e
          docker run -d --name coturn-smoke --network host \
            -v /tmp/turnserver.conf:/etc/coturn/turnserver.conf:ro \
            coturn/coturn:4.6.2 -c /etc/coturn/turnserver.conf
          sleep 5
          running=$(docker inspect -f '{{.State.Running}}' coturn-smoke 2>/dev/null)
          docker logs coturn-smoke > /tmp/coturn.log 2>&1
          docker rm -f coturn-smoke >/dev/null 2>&1
          set -e
          echo "----- coturn log -----"; cat /tmp/coturn.log; echo "----------------------"
          if [ "$running" != "true" ]; then
            echo "::error::coturn exited early — it likely rejected the config"; exit 1
          fi
          if grep -iq 'cannot parse' /tmp/coturn.log; then
            echo "::error::coturn reported a config parse error"; exit 1
          fi
          echo "coturn started and stayed up — config accepted"
