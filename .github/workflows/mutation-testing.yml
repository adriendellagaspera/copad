name: Mutation testing

# Two lanes, mirroring reconcile-rs's mutants.yml: a PR-diff gate that fails on a surviving mutant
# in changed lines, and a scheduled full-sweep reported as a non-blocking trend. A full sweep is
# too slow to gate every PR on (113 non-test .ts files, ~9.5k lines — plausibly hundreds of
# mutants); the diff-scoped gate is typically a handful of mutants and stays fast.
on:
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Same rationale as ci.yml's `changes` job: a change that touches no .ts file under src/ (docs,
  # workflow-unrelated config, deploy/turn/**, e2e/**) cannot change Stryker's verdict, and the
  # dry-run test pass is the expensive part of this workflow. `schedule`/`workflow_dispatch` have
  # no PR to diff against, so `nightly` below never depends on this output.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'src/**/*.ts'
              - 'stryker.config.mjs'
              - 'tsconfig.json'
              - '.github/scripts/check-mutation-gate.mjs'
              - '.github/workflows/mutation-testing.yml'

  # Gates every PR on the mutants introduced by that PR's own diff only. check-mutation-gate.mjs
  # is the single source of truth for the command (AGENTS.md §10: a rule enforced ad hoc in a
  # workflow belongs in a script both this job and a contributor's local run call), and it carries
  # the diff-to---mutate-range translation StrykerJS has no native flag for (unlike cargo-mutants'
  # --in-diff, tracked upstream as stryker-js#551/#2843, both unresolved for years).
  pr-diff:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: git fetch origin main --quiet
      - run: node .github/scripts/check-mutation-gate.mjs origin/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-incremental
          path: reports/
          if-no-files-found: ignore

  # Mirrors ci.yml's ci-success, for the same reason: branch protection pins a required check by
  # job name, so this workflow needs its own stable aggregate rather than pointing protection
  # straight at pr-diff. Pointing at pr-diff directly is doubly wrong here — changes skips it on a
  # non-.ts PR, and a required check a skip leaves pending forever blocks the merge instead of
  # passing it. `if: always()` and the skip/failure treatment are exactly ci.yml's ci-success
  # reasoning; see that job's comment for the detail.
  mutation-success:
    name: mutation-success
    if: always() && github.event_name == 'pull_request'
    needs:
      - changes
      - pr-diff
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::one or more mutation-gate jobs failed or were cancelled"
          exit 1

  # Full-workspace sweep, reported as a trend and NOT gated: a whole-repo mutation score is a
  # number to watch, not a wall — hence continue-on-error and no mutation-success dependency
  # (contrast pr-diff above, which mutation-success does require).
  #
  # Unsharded, deliberately: StrykerJS has no equivalent of cargo-mutants' --shard (verified: no
  # such CLI flag or config option exists in @stryker-mutator/core), so splitting this would mean
  # hand-partitioning file globs into N buckets with no real timing data yet to size them by.
  # 60 minutes is a starting budget, not a measured one — tune (or add sharding via hand-split
  # `mutate` globs) once a real run reports how long a full sweep actually takes here.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx stryker run --reporters html,clear-text
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-nightly
          path: reports/
          if-no-files-found: ignore
