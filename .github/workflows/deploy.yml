name: Deploy

on:
  push:
    branches: [main]
  # Re-publishing main otherwise requires a new commit.
  workflow_dispatch:

# Branch-based Pages, not the artifact API, so pr-<N>/ previews can share the
# branch. The last step below asserts that source setting; pages: write is for it.
permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages
  # Supersede, never queue: each run publishes a complete build, so the newest
  # push is the only one worth finishing. Queuing lets one stuck run hold the
  # group forever, since GitHub cancels the previously pending run, not that one.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A hung run must not hold the group; superseding covers the rest.
    timeout-minutes: 15
    # No `environment: github-pages`: under branch-based Pages its auto-managed
    # branch policy is scoped to gh-pages, so a job on main claiming it never
    # starts. Publishing needs only `contents: write`.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build -- --base=/copad/
        # Vite inlines every VITE_* into the public bundle, so none is secret:
        # they are repo Variables, not Secrets. Reference: docs/architecture.md.
        env:
          VITE_DROPBOX_APP_KEY:   ${{ vars.VITE_DROPBOX_APP_KEY }}
          VITE_PCLOUD_CLIENT_ID:  ${{ vars.VITE_PCLOUD_CLIENT_ID }}
          VITE_PROXY_URL:         ${{ vars.VITE_PROXY_URL }}
          VITE_WEBDAV_URL:        ${{ vars.VITE_WEBDAV_URL }}
          VITE_STORAGE_BACKEND:   ${{ vars.VITE_STORAGE_BACKEND }}
          VITE_REDIRECT_URI:      https://adriendellagaspera.github.io/copad/redirect.html
          VITE_COLLAB_TRANSPORT:  ${{ vars.VITE_COLLAB_TRANSPORT }}
          VITE_SIGNALING_URL:     ${{ vars.VITE_SIGNALING_URL }}
          VITE_WEBSOCKET_URL:     ${{ vars.VITE_WEBSOCKET_URL }}
          VITE_DEFAULT_ROOM:      ${{ vars.VITE_DEFAULT_ROOM }}
          VITE_ROOM_PASSWORD:     ${{ vars.VITE_ROOM_PASSWORD }}
          VITE_STUN_URL:          ${{ vars.VITE_STUN_URL }}
          VITE_TURN_URL:          ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USERNAME:     ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_PASSWORD:     ${{ vars.VITE_TURN_PASSWORD }}
          VITE_ICE_SERVERS_URL:   ${{ vars.VITE_ICE_SERVERS_URL }}
          VITE_ICE_FETCH_TIMEOUT_MS: ${{ vars.VITE_ICE_FETCH_TIMEOUT_MS }}

      # Preserves pr-<N>/ preview directories from other workflow runs.
      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/deploy-gh-pages.sh ""

      # On any other Pages source every push to this branch is ignored and the
      # site 404s. Best-effort: it never fails the build.
      - name: Ensure Pages serves the gh-pages branch
        uses: actions/github-script@v7
        with:
          script: |
            const ensurePagesSource = require('./.github/scripts/ensure-pages-source.cjs')
            await ensurePagesSource({ github, context, core })
