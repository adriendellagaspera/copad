name: Bug report
description: Shipped behavior contradicts the intent or the contract
title: "<short imperative title>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short — a scannable issue gets triaged, a long one doesn't. Cite `file:line` instead of describing code in prose.

        **Labels** — the type is already set. On triage a maintainer adds one or more `area:`, and `surface:` if it is touch- or desktop-specific. Until an `area:` is set, `status:needs-triage` stays on automatically. The vocabulary is [`.github/labels.cjs`](../labels.cjs).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's broken. Cite file:line if it sharpens the claim.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Minimal steps to reproduce, or the failing input/state.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: 1-3 checkbox bullets describing the fixed behavior.
      value: |
        - [ ]
    validations:
      required: true
