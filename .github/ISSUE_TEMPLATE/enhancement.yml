name: Enhancement
description: A capability that doesn't exist, or one below the bar
title: "<short imperative title>"
body:
  - type: markdown
    attributes:
      value: |
        Keep it short — a scannable issue gets triaged, a long one doesn't. No "Motivation"/"SOTA"/"Context" essays; cite `file:line` instead of describing code in prose.

        **Labels** — deliberately none at creation: `type:feature` (a capability that does not exist) vs `type:polish` (one that exists but is below the bar) is a triage call, not a filing one. A maintainer sets it with one or more `area:`; until then `status:needs-triage` stays on automatically. The vocabulary is [`.github/labels.cjs`](../labels.cjs).

        Investigating rather than building? Use **Spike**. Asking rather than proposing? Use **Decision**.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 1-2 sentences. What's broken or missing. Cite file:line if it sharpens the claim.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Fix
      description: 1-3 short bullets. Concrete approach, not a design essay.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: 2-4 checkbox bullets.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
