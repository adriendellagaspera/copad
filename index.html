<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Copad — write together while you're both here</title>
    <meta
      name="description"
      content="Share a link and write together in real time. Text moves directly between browsers — no account, nothing stored for you. What you want to keep, you save to your own cloud storage."
    />

    <!-- No og:url, image left relative: self-hosted at unknown origins/paths. See docs/architecture.md "Link previews". -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Copad" />
    <meta property="og:title" content="Copad — write together while you're both here" />
    <meta
      property="og:description"
      content="Share a link and write together in real time. Text moves directly between browsers — no account, nothing stored for you. What you want to keep, you save to your own cloud storage."
    />
    <meta property="og:image" content="./og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A sheet of paper carrying two people's live cursors, labelled Ada and Rui."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="A sheet of paper carrying two people's live cursors, labelled Ada and Rui."
    />

    <link rel="icon" type="image/svg+xml" href="/copad/favicon.svg" />
    <link rel="apple-touch-icon" href="/copad/icons/icon-192.png" />
    <link rel="manifest" href="/copad/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Copad" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `media` can only track the OS, not this app's own theme override, so JS sets theme-color directly. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Runs pre-paint to avoid a theme flash. THEME_COLOR must be kept in sync with ui/theme.svelte.ts by hand: this inline script can't import it. -->
    <script>
      (function () {
        var THEME_COLOR = { light: '#ffffff', dark: '#1e1e24' };
        try {
          var choice = localStorage.getItem('copad:theme') || 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', THEME_COLOR[resolved]);
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" crossorigin src="/copad/assets/main-DBLTRYPc.js"></script>
    <link rel="modulepreload" crossorigin href="/copad/assets/lib-D54bnSvk.js">
    <link rel="stylesheet" crossorigin href="/copad/assets/main-COkZUVY0.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
