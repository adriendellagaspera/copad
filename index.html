<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Copad — collaborative writing</title>
    <meta
      name="description"
      content="Copad is a real-time collaborative writing tool. Write together peer-to-peer, no server required, and save to your own cloud storage."
    />
    <link rel="icon" type="image/svg+xml" href="/copad/favicon.svg" />
    <!-- Content set by the scripts below, not by a `media` attribute: this app
         has its own light/dark/system choice (localStorage, ui/theme.svelte.ts)
         independent of the OS's prefers-color-scheme, so a user who forces a
         theme opposite their OS setting would otherwise get browser chrome
         tinted for the *wrong* one — a `media`-conditioned tag can only ever
         track the OS, never an in-app override. One tag both scripts update in
         place is what actually stays right. Matches --surface (tokens.css), not
         --bg: on mobile the editor runs edge-to-edge (editor.css's full-bleed
         rules), so --surface is what actually touches the top of the viewport,
         right up to the status bar. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Resolve the theme before first paint to avoid a flash of the wrong theme
         (and keep the theme-color tag above in lockstep — see its comment).
         THEME_COLOR mirrors --surface per resolved theme (tokens.css) — kept
         in sync with ui/theme.svelte.ts's copy of the same map by hand, since
         this inline script can't import a module. -->
    <script>
      (function () {
        var THEME_COLOR = { light: '#ffffff', dark: '#1e1e24' };
        try {
          var choice = localStorage.getItem('copad:theme') || 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', THEME_COLOR[resolved]);
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" crossorigin src="/copad/assets/main-BKPUXMfa.js"></script>
    <link rel="modulepreload" crossorigin href="/copad/assets/lib-D54bnSvk.js">
    <link rel="stylesheet" crossorigin href="/copad/assets/main-D2LC3WMh.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
